kind = "web"
previewPath = "/"
title = "Forever Guild Builder"
description = "Private, shared-key World of Warcraft: Forever guild rosters and raid split planning."
version = "1.0.0"
id = "artifacts/raid-roster"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25471

[services.development]
run = "pnpm --filter @workspace/raid-roster run dev"

[services.production.run]
args = [ "node", "server.js" ]

[services.production.run.env]
PORT = "25471"
NODE_ENV = "production"

[services.env]
PORT = "25471"
BASE_PATH = "/"