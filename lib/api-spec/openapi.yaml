openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /roster:
    get:
      operationId: getRoster
      summary: Read the guild roster
      responses:
        "200":
          description: Members and storage status
          content:
            application/json:
              schema:
                type: object
                required: [members, storage]
                properties:
                  members:
                    type: array
                    items:
                      $ref: "#/components/schemas/RosterMember"
                  storage:
                    type: string
                    enum: [local, redis, missing]
    post:
      operationId: saveRosterMember
      summary: Sign up or partially edit a member when id is supplied
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RosterInput"
      responses:
        "200":
          description: Saved member
          content:
            application/json:
              schema:
                type: object
                required: [member]
                properties:
                  member:
                    $ref: "#/components/schemas/RosterMember"
        "400":
          description: Invalid character or profession choices
        "404":
          description: Member was removed
        "409":
          description: Duplicate name
        "403":
          description: Roster has reached its 100-member limit
        "503":
          description: Published storage is not connected
    delete:
      operationId: deleteRosterMember
      summary: Remove a member
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "404":
          description: Member was already removed
        "503":
          description: Published storage is not connected
  /roster/splits:
    get:
      operationId: getSplitSetups
      summary: List saved raid split setups
      responses:
        "200":
          description: Saved setups and storage status
          content:
            application/json:
              schema:
                type: object
                required: [setups, storage]
                properties:
                  setups:
                    type: array
                    items:
                      $ref: "#/components/schemas/SplitSetup"
                  storage:
                    type: string
                    enum: [local, redis, missing]
    post:
      operationId: saveSplitSetup
      summary: Create a setup or replace the setup identified by id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SplitInput"
      responses:
        "200":
          description: Saved setup
          content:
            application/json:
              schema:
                type: object
                required: [setup]
                properties:
                  setup:
                    $ref: "#/components/schemas/SplitSetup"
        "400":
          description: Invalid teams or assignments
        "404":
          description: Setup no longer exists
        "409":
          description: Setup name already exists
        "503":
          description: Storage is not connected
    delete:
      operationId: deleteSplitSetup
      summary: Remove a saved setup without changing the roster
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        "404":
          description: Setup no longer exists
        "503":
          description: Storage is not connected
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    SplitTeam:
      type: object
      required: [id, name, size, memberIds]
      properties:
        id: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 40 }
        size: { type: integer, enum: [10, 20, 40] }
        memberIds:
          type: array
          maxItems: 40
          uniqueItems: true
          items: { type: string }
    SplitInput:
      type: object
      required: [name, teams]
      properties:
        id: { type: string }
        name: { type: string, minLength: 1, maxLength: 60 }
        teams:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: "#/components/schemas/SplitTeam"
    SplitSetup:
      allOf:
        - $ref: "#/components/schemas/SplitInput"
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            createdAt: { type: string }
            updatedAt: { type: string }
    RosterCharacter:
      type: object
      properties:
        class: { type: string }
        spec: { type: [string, "null"] }
        race: { type: [string, "null"] }
        will: { type: string }
    RosterInput:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        main:
          $ref: "#/components/schemas/RosterCharacter"
        alts:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/RosterCharacter"
        professions:
          type: array
          items: { type: string }
        notes: { type: string, maxLength: 200 }
        assignment: { type: [string, "null"] }
    RosterMember:
      allOf:
        - $ref: "#/components/schemas/RosterInput"
        - type: object
          required: [id, name, main, alts]
          properties:
            createdAt: { type: string }
            updatedAt: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

