openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /guilds:
    post:
      operationId: createPrivateGuild
      summary: Turnstile-verified creation with one-time guild credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGuildInput"
      responses:
        "201":
          description: Guild and one-time credentials with an authenticated cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuildCredentialsResponse"
        "400":
          description: Invalid guild or bot verification
        "429":
          description: Creation limit reached
        "503":
          description: Setup missing, bot verification unavailable or capacity reached
  /guild/rotate:
    post:
      operationId: rotatePrivateGuildKey
      summary: Authenticated key rotation with current key or recovery code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuildCredentialInput"
      responses:
        "200":
          description: New key shown once; all old sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuildCredentialsResponse"
        "401":
          description: Missing session or incorrect credential
        "429":
          description: Too many attempts
  /guild/recover:
    post:
      operationId: recoverPrivateGuildKey
      summary: Recover a lost key using a private slug and recovery code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuildRecoveryInput"
      responses:
        "200":
          description: New key shown once and a replacement session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuildCredentialsResponse"
        "401":
          description: Incorrect guild or recovery code
        "429":
          description: Too many attempts
  /config:
    get:
      operationId: getGuildConfiguration
      summary: Public setup availability without secret values
      responses:
        "200":
          description: Setup availability
          content:
            application/json:
              schema:
                type: object
                required: [storageConfigured, sessionsConfigured, creationEnabled, turnstileSiteKey]
                properties:
                  storageConfigured:
                    type: boolean
                  sessionsConfigured:
                    type: boolean
                  creationEnabled:
                    type: boolean
                  turnstileSiteKey:
                    type: [string, "null"]
  /session:
    post:
      operationId: loginToGuild
      summary: Exchange a private guild slug and key for a signed session cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuildLoginInput"
      responses:
        "200":
          description: Signed in with a secure HttpOnly cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuildResponse"
        "401":
          description: Incorrect guild URL or key
        "429":
          description: Too many attempts
        "503":
          description: Storage or sessions are not configured
    delete:
      operationId: logoutFromGuild
      summary: Clear the guild session cookie
      responses:
        "200":
          description: Signed out
  /guild:
    patch:
      operationId: updatePrivateGuildSettings
      summary: Change only allowed settings of the session-bound guild
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuildSettingsInput"
      responses:
        "200":
          description: Saved settings and any faction-invalid characters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuildSettingsResponse"
        "400":
          description: Invalid settings
        "401":
          description: Missing or revoked session
    delete:
      operationId: deletePrivateGuild
      summary: Delete the session-bound guild with key and exact-name confirmation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuildDeleteInput"
      responses:
        "200":
          description: Guild removed and session cleared
        "400":
          description: Typed name does not match
        "401":
          description: Missing session or incorrect key
    get:
      operationId: getCurrentGuild
      summary: Public metadata for the guild bound to the verified session
      responses:
        "200":
          description: Current guild
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuildResponse"
        "401":
          description: Missing, expired or revoked session
        "503":
          description: Storage or sessions are unavailable
  /roster:
    get:
      operationId: getRoster
      summary: Read the guild roster
      responses:
        "200":
          description: Members and storage status
          content:
            application/json:
              schema:
                type: object
                required: [members, storage]
                properties:
                  members:
                    type: array
                    items:
                      $ref: "#/components/schemas/RosterMember"
                  storage:
                    type: string
                    enum: [local, redis, missing]
                  guild:
                    $ref: "#/components/schemas/PublicGuild"
    post:
      operationId: saveRosterMember
      summary: Sign up or partially edit a member when id is supplied
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RosterInput"
      responses:
        "200":
          description: Saved member
          content:
            application/json:
              schema:
                type: object
                required: [member]
                properties:
                  member:
                    $ref: "#/components/schemas/RosterMember"
        "400":
          description: Invalid character or profession choices
        "404":
          description: Member was removed
        "409":
          description: Duplicate name
        "403":
          description: Roster has reached its 100-member limit
        "503":
          description: Published storage is not connected
    delete:
      operationId: deleteRosterMember
      summary: Remove a member
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "404":
          description: Member was already removed
        "503":
          description: Published storage is not connected
  /roster/splits:
    get:
      operationId: getSplitSetups
      summary: List saved raid split setups
      responses:
        "200":
          description: Saved setups and storage status
          content:
            application/json:
              schema:
                type: object
                required: [setups, storage]
                properties:
                  setups:
                    type: array
                    items:
                      $ref: "#/components/schemas/SplitSetup"
                  storage:
                    type: string
                    enum: [local, redis, missing]
    post:
      operationId: saveSplitSetup
      summary: Create a setup or replace the setup identified by id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SplitInput"
      responses:
        "200":
          description: Saved setup
          content:
            application/json:
              schema:
                type: object
                required: [setup]
                properties:
                  setup:
                    $ref: "#/components/schemas/SplitSetup"
        "400":
          description: Invalid teams or assignments
        "404":
          description: Setup no longer exists
        "409":
          description: Setup name already exists
        "503":
          description: Storage is not connected
    delete:
      operationId: deleteSplitSetup
      summary: Remove a saved setup without changing the roster
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        "404":
          description: Setup no longer exists
        "503":
          description: Storage is not connected
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    CreateGuildInput:
      type: object
      required: [name, faction, turnstileToken]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 24
        faction:
          type: string
          enum: [horde, alliance]
        turnstileToken:
          type: string
          maxLength: 2048
    GuildCredentialInput:
      type: object
      properties:
        key:
          type: string
          maxLength: 200
        recoveryCode:
          type: string
          maxLength: 200
    GuildRecoveryInput:
      type: object
      required: [slug, recoveryCode]
      properties:
        slug:
          type: string
        recoveryCode:
          type: string
          maxLength: 200
    GuildDeleteInput:
      type: object
      required: [key, confirmation]
      properties:
        key:
          type: string
          maxLength: 200
        confirmation:
          type: string
    GuildSettingsInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 24
        faction:
          type: string
          enum: [horde, alliance]
        donationDismissed:
          type: boolean
    GuildCredentialsResponse:
      type: object
      required: [guild, key]
      properties:
        guild:
          $ref: "#/components/schemas/PublicGuild"
        key:
          type: string
        recoveryCode:
          type: string
    GuildSettingsResponse:
      type: object
      required: [guild, invalidRaces]
      properties:
        guild:
          $ref: "#/components/schemas/PublicGuild"
        invalidRaces:
          type: array
          items:
            type: object
            required: [name, race]
            properties:
              name:
                type: string
              race:
                type: string
    GuildLoginInput:
      type: object
      required: [slug, key]
      properties:
        slug:
          type: string
        key:
          type: string
          maxLength: 200
    PublicGuild:
      type: object
      required: [id, name, slug, faction, donationDismissed]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        faction:
          type: string
          enum: [horde, alliance]
        donationDismissed:
          type: boolean
    GuildResponse:
      type: object
      required: [guild]
      properties:
        guild:
          $ref: "#/components/schemas/PublicGuild"
    SplitTeam:
      type: object
      required: [id, name, size, memberIds]
      properties:
        id: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 40 }
        size: { type: integer, enum: [10, 20, 40] }
        memberIds:
          type: array
          maxItems: 40
          uniqueItems: true
          items: { type: string }
    SplitInput:
      type: object
      required: [name, teams]
      properties:
        id: { type: string }
        name: { type: string, minLength: 1, maxLength: 60 }
        teams:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: "#/components/schemas/SplitTeam"
    SplitSetup:
      allOf:
        - $ref: "#/components/schemas/SplitInput"
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            createdAt: { type: string }
            updatedAt: { type: string }
    RosterCharacter:
      type: object
      properties:
        class: { type: string }
        spec: { type: [string, "null"] }
        race: { type: [string, "null"] }
        will: { type: string }
    RosterInput:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        main:
          $ref: "#/components/schemas/RosterCharacter"
        alts:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/RosterCharacter"
        professions:
          type: array
          items: { type: string }
        notes: { type: string, maxLength: 200 }
        assignment: { type: [string, "null"] }
    RosterMember:
      allOf:
        - $ref: "#/components/schemas/RosterInput"
        - type: object
          required: [id, name, main, alts]
          properties:
            createdAt: { type: string }
            updatedAt: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

